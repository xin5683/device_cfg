[package]
name = "device_cfg"
version = "0.1.3"
edition = "2024"
description = "Embedded device control web console with WiFi configuration APIs"
license = "MIT"
repository = "https://github.com/xin5683/device_cfg"
readme = "README.md"
keywords = ["embedded", "wifi", "axum", "device-config"]
categories = ["embedded", "web-programming::http-server"]
publish = false

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "json", "rustls"] }
self_update = { version = "0.44", default-features = false, features = ["reqwest", "rustls", "archive-tar", "compression-flate2"] }
semver = "1"
tempfile = "3"
tower-http = { version = "0.6", features = ["cors"] }
webpki-root-certs = "1"
