<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>设备配置中心</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div class="ambient-light ambient-light-1"></div>
    <div class="ambient-light ambient-light-2"></div>
    <div class="ambient-light ambient-light-3"></div>

    <main class="app-container">
        <!-- 顶部导航栏 -->
        <header class="navbar glass-surface">
            <div class="navbar-content">
                <div class="navbar-brand">
                    <div class="brand-icon">
                        <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
                            <circle cx="14" cy="14" r="12" stroke="currentColor" stroke-width="2" opacity="0.3"/>
                            <circle cx="14" cy="14" r="7" stroke="currentColor" stroke-width="2"/>
                            <circle cx="14" cy="14" r="3" fill="currentColor"/>
                        </svg>
                    </div>
                    <span class="brand-title">设备配置中心</span>
                </div>
                <div class="version-pill" aria-label="当前系统版本">
                    <span>版本</span>
                    <strong id="system-version">加载中</strong>
                </div>
            </div>
        </header>

        <!-- 主内容区域 -->
        <div class="main-content">
            <!-- C位：当前连接状态 -->
            <section class="hero-grid" aria-label="状态卡片区域">
                <article class="hero-status glass-surface">
                    <div class="hero-status-header">
                        <div class="hero-status-heading">
                            <p class="status-label">WiFi 状态</p>
                        </div>
                        <span class="status-card-badge">wlan1</span>
                    </div>
                    <div class="status-info">
                        <div id="hero-status-content">
                            <p class="status-loading">正在加载...</p>
                        </div>
                    </div>
                    <div class="hero-status-footer">
                        <button id="disconnect-btn" class="btn btn-danger" style="display:none;">断开连接</button>
                    </div>
                </article>
            </section>

            <!-- 标签页导航 -->
            <nav class="tab-navigation glass-surface">
                <button class="tab-item active" data-tab="wifi">
                    <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                        <path d="M10 14a2 2 0 100 4 2 2 0 000-4zM3.05 7.05a9 9 0 0113.9 0M5.93 9.93a5.5 5.5 0 018.14 0" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                    </svg>
                    <span>无线网络</span>
                </button>
                <button class="tab-item" data-tab="update">
                    <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                        <path d="M10 3v8M10 11l3-3M10 11L7 8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M4 13v2a2 2 0 002 2h8a2 2 0 002-2v-2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
                    </svg>
                    <span>系统更新</span>
                </button>
                <button class="tab-item" data-tab="diagnostic" disabled>
                    <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                        <path d="M10 2v16M2 10h16" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                        <circle cx="10" cy="10" r="7" stroke="currentColor" stroke-width="1.5"/>
                    </svg>
                    <span>诊断工具</span>
                </button>
                <button class="tab-item" data-tab="logs" disabled>
                    <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                        <rect x="3" y="3" width="14" height="14" rx="2" stroke="currentColor" stroke-width="1.5"/>
                        <path d="M6 7h8M6 10h5M6 13h6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                    </svg>
                    <span>系统日志</span>
                </button>
            </nav>

            <!-- 标签页内容 -->
            <div class="tab-content">
                <!-- WiFi 标签页 -->
                <div class="tab-panel active" data-panel="wifi">
                    <section class="content-card glass-surface">
                        <div class="card-header">
                            <div class="header-text">
                                <h2>可用网络</h2>
                                <p class="card-subtitle">扫描并连接附近的 WiFi 热点</p>
                            </div>
                            <button id="scan-btn" class="btn btn-primary">
                                <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                                    <path d="M14 8a6 6 0 11-12 0 6 6 0 0112 0z" stroke="currentColor" stroke-width="1.5"/>
                                    <path d="M8 2v2M8 12v2M2 8h2M12 8h2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                                </svg>
                                <span>扫描网络</span>
                            </button>
                        </div>
                        <div id="network-list" class="network-list">
                            <div class="empty-state">
                                <div class="empty-icon">
                                    <svg width="48" height="48" viewBox="0 0 48 48" fill="none">
                                        <circle cx="24" cy="24" r="20" stroke="currentColor" stroke-width="2" opacity="0.2"/>
                                        <path d="M12 20a14 14 0 0124 0M16 26a8 8 0 0116 0" stroke="currentColor" stroke-width="2" stroke-linecap="round" opacity="0.3"/>
                                    </svg>
                                </div>
                                <p>点击“扫描网络”开始搜索</p>
                            </div>
                        </div>
                    </section>
                </div>

                <!-- 系统更新标签页 -->
                <div class="tab-panel" data-panel="update">
                    <section class="content-card glass-surface">
                        <div class="card-header">
                            <div class="header-text">
                                <h2>系统更新</h2>
                                <p class="card-subtitle">从 GitHub Release 获取设备固件包</p>
                            </div>
                            <div class="update-actions">
                                <button id="update-check-btn" class="btn btn-secondary">
                                    <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                                        <path d="M13.5 8a5.5 5.5 0 11-1.61-3.89" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                                        <path d="M13.5 3.5v4h-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                                    </svg>
                                    <span>检查更新</span>
                                </button>
                                <button id="update-apply-btn" class="btn btn-primary" disabled>
                                    <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                                        <path d="M8 2v8M8 10l3-3M8 10L5 7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                                        <path d="M3 12.5h10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                                    </svg>
                                    <span>立即更新</span>
                                </button>
                            </div>
                        </div>
                        <div id="update-panel" class="update-panel">
                            <div class="update-status-card">
                                <div class="update-icon">
                                    <svg width="36" height="36" viewBox="0 0 36 36" fill="none">
                                        <path d="M18 6v15M18 21l5-5M18 21l-5-5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                        <path d="M9 26h18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                                    </svg>
                                </div>
                                <div>
                                    <h3 id="update-title">尚未检查更新</h3>
                                    <p id="update-summary">点击“检查更新”获取最新 release 信息。</p>
                                </div>
                            </div>
                            <div id="update-details" class="update-details"></div>
                        </div>
                    </section>
                </div>

                <!-- 设备概览标签页 -->
                <div class="tab-panel" data-panel="overview">
                    <section class="content-card glass-surface">
                        <div class="coming-soon">
                            <div class="coming-soon-icon">
                                <svg width="64" height="64" viewBox="0 0 64 64" fill="none">
                                    <rect x="12" y="12" width="40" height="40" rx="8" stroke="currentColor" stroke-width="2" opacity="0.2"/>
                                    <circle cx="32" cy="32" r="8" stroke="currentColor" stroke-width="2" opacity="0.3"/>
                                </svg>
                            </div>
                            <h3>敬请期待</h3>
                            <p>敬请期待</p>
                        </div>
                    </section>
                </div>

                <!-- 诊断工具标签页 -->
                <div class="tab-panel" data-panel="diagnostic">
                    <section class="content-card glass-surface">
                        <div class="coming-soon">
                            <div class="coming-soon-icon">
                                <svg width="64" height="64" viewBox="0 0 64 64" fill="none">
                                    <circle cx="32" cy="32" r="24" stroke="currentColor" stroke-width="2" opacity="0.2"/>
                                    <path d="M32 16v16l8 8" stroke="currentColor" stroke-width="2" stroke-linecap="round" opacity="0.3"/>
                                </svg>
                            </div>
                            <h3>敬请期待</h3>
                            <p>敬请期待</p>
                        </div>
                    </section>
                </div>

                <!-- 系统日志标签页 -->
                <div class="tab-panel" data-panel="logs">
                    <section class="content-card glass-surface">
                        <div class="coming-soon">
                            <div class="coming-soon-icon">
                                <svg width="64" height="64" viewBox="0 0 64 64" fill="none">
                                    <rect x="16" y="12" width="32" height="40" rx="4" stroke="currentColor" stroke-width="2" opacity="0.2"/>
                                    <path d="M24 24h16M24 32h12M24 40h14" stroke="currentColor" stroke-width="2" stroke-linecap="round" opacity="0.3"/>
                                </svg>
                            </div>
                            <h3>敬请期待</h3>
                            <p>敬请期待</p>
                        </div>
                    </section>
                </div>
            </div>
        </div>
    </main>

    <!-- 连接弹窗 -->
    <div id="modal" class="modal" style="display:none;">
        <div class="modal-backdrop"></div>
        <div class="modal-dialog glass-surface">
            <div class="modal-header">
                <h3 id="modal-title">连接到网络</h3>
                <p id="modal-ssid" class="modal-ssid"></p>
            </div>
            <div class="modal-body">
                <div id="password-group" class="input-group">
                    <label for="password-input">密码</label>
                    <input type="password" id="password-input" placeholder="输入网络密码" autocomplete="off">
                </div>
            </div>
            <div class="modal-footer">
                <button id="cancel-btn" class="btn btn-secondary">取消</button>
                <button id="connect-btn" class="btn btn-primary">连接</button>
            </div>
        </div>
    </div>

    <!-- Toast 提示 -->
    <div id="toast" class="toast" style="display:none;"></div>

    <script src="/app.js"></script>
</body>
</html>
