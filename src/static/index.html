<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WiFi 配置</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>WiFi 配置</h1>
        </header>

        <section id="status-section" class="card">
            <h2>当前状态</h2>
            <div id="status-content">
                <p class="status-loading">加载中...</p>
            </div>
            <button id="disconnect-btn" class="btn btn-danger" style="display:none;">断开连接</button>
        </section>

        <section class="card">
            <div class="section-header">
                <h2>可用网络</h2>
                <button id="scan-btn" class="btn btn-primary">扫描</button>
            </div>
            <div id="network-list">
                <p class="hint">点击"扫描"按钮搜索 WiFi 网络</p>
            </div>
        </section>
    </div>

    <div id="modal" class="modal" style="display:none;">
        <div class="modal-content">
            <h3 id="modal-title">连接 WiFi</h3>
            <p id="modal-ssid" class="modal-ssid"></p>
            <div id="password-group" class="form-group">
                <label for="password-input">密码</label>
                <input type="password" id="password-input" placeholder="输入 WiFi 密码" autocomplete="off">
            </div>
            <div class="modal-actions">
                <button id="cancel-btn" class="btn btn-secondary">取消</button>
                <button id="connect-btn" class="btn btn-primary">连接</button>
            </div>
        </div>
    </div>

    <div id="toast" class="toast" style="display:none;"></div>

    <script src="/app.js"></script>
</body>
</html>
