name: build

on:
  push:
    branches:
      - "**"
    tags:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-unknown-linux-musl
            image: ghcr.io/rust-cross/rust-musl-cross:aarch64-musl
          - target: armv7-unknown-linux-musleabihf
            image: ghcr.io/rust-cross/rust-musl-cross:armv7-musleabihf

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Build
        run: |
          docker run --rm \
            -e TARGET="${{ matrix.target }}" \
            -e HOST_UID="$(id -u)" \
            -e HOST_GID="$(id -g)" \
            -v "${PWD}:/work" \
            -w "/work" \
            "${{ matrix.image }}" \
            sh -c 'cargo build --release --target "${TARGET}" && chown -R "${HOST_UID}:${HOST_GID}" target'

      - name: Package
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/device_cfg" "dist/device_cfg-${{ matrix.target }}"
          tar -C dist -czf "dist/device_cfg-${{ matrix.target }}.tar.gz" "device_cfg-${{ matrix.target }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: device_cfg-${{ matrix.target }}
          path: dist/device_cfg-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  release:
    name: release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v7
        with:
          path: release-artifacts

      - name: Create release archives list
        id: files
        run: |
          echo "paths<<EOF" >> "$GITHUB_OUTPUT"
          find release-artifacts -name '*.tar.gz' -type f | sort >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.files.outputs.paths }}
