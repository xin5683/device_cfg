name: build

on:
  push:
    branches:
      - "**"
    tags:
      - "**"
  pull_request:

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-unknown-linux-musl
            image: ghcr.io/rust-cross/rust-musl-cross:aarch64-musl
          - target: armv7-unknown-linux-musleabihf
            image: ghcr.io/rust-cross/rust-musl-cross:armv7-musleabihf

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Set up Rust toolchain
        run: rustup toolchain install stable --profile minimal

      - name: Cache build image
        uses: docker/build-push-action@v7
        env:
          DOCKER_BUILD_RECORD_UPLOAD: "false"
        with:
          context: .
          file: .github/docker/build.Dockerfile
          build-args: |
            BUILD_IMAGE=${{ matrix.image }}
          tags: device-cfg-build:${{ matrix.target }}
          load: true
          cache-from: type=gha,scope=device-cfg-build-image-${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=device-cfg-build-image-${{ matrix.target }}
          pull: true

      - name: Prepare Cargo cache directories
        run: mkdir -p .cargo-registry .cargo-git

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
          workspaces: |
            . -> target
          cache-directories: |
            .cargo-registry
            .cargo-git

      - name: Build
        run: |
          docker run --rm \
            -e TARGET="${{ matrix.target }}" \
            -e HOST_UID="$(id -u)" \
            -e HOST_GID="$(id -g)" \
            -v "${PWD}:/work" \
            -v "${PWD}/.cargo-registry:/root/.cargo/registry" \
            -v "${PWD}/.cargo-git:/root/.cargo/git" \
            -w "/work" \
            "device-cfg-build:${{ matrix.target }}" \
            sh -c 'cargo build --release --target "${TARGET}" && chown -R "${HOST_UID}:${HOST_GID}" target /root/.cargo/registry /root/.cargo/git'

      - name: Package
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/device_cfg" "dist/device_cfg-${{ matrix.target }}"
          tar -C dist -czf "dist/device_cfg-${{ matrix.target }}.tar.gz" "device_cfg-${{ matrix.target }}"
          sha256sum "dist/device_cfg-${{ matrix.target }}.tar.gz" > "dist/device_cfg-${{ matrix.target }}.tar.gz.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: device_cfg-${{ matrix.target }}
          path: |
            dist/device_cfg-${{ matrix.target }}.tar.gz
            dist/device_cfg-${{ matrix.target }}.tar.gz.sha256
          if-no-files-found: error

  release:
    name: release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: device_cfg-*
          path: release-artifacts

      - name: Create release archives list
        id: files
        run: |
          echo "paths<<EOF" >> "$GITHUB_OUTPUT"
          find release-artifacts \( -name '*.tar.gz' -o -name '*.tar.gz.sha256' \) -type f | sort >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.files.outputs.paths }}
